<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asahi Fuji | OPTO TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white">

    <div id="navbar-placeholder"></div>

    <main class="pt-20">
        <!-- Hero -->
        <section class="py-24 bg-white overflow-hidden">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                    <div class="fade-up">
                        <div class="inline-block px-4 py-2 bg-[#1e88e5]/10 text-[#1e88e5] rounded-full text-sm font-bold mb-6">Japanese Precision</div>
                        <h1 class="text-6xl font-bold mb-6 text-[#0b2a4a]">Asahi Fuji</h1>
                        <p class="text-2xl text-gray-600 mb-8 leading-relaxed">
                            Japanese Precision Optics. Crafted with decades of expertise in optical excellence and material science.
                        </p>
                    </div>
                    <div class="fade-up h-[500px] rounded-[3rem] overflow-hidden shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1582142839930-2233e73b21bd?auto=format&fit=crop&q=80&w=800" alt="Asahi Fuji" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </section>

        <!-- Product Grid for Asahi Fuji -->
        <section class="py-24 bg-gray-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <h2 class="text-3xl font-bold mb-12 text-[#0b2a4a] fade-up">Asahi Fuji Collections</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Product Card 1 -->
                    <div class="brand-card bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100 flex flex-col fade-up">
                        <div class="h-48 bg-gray-100 relative overflow-hidden group">
                            <img src="https://images.unsplash.com/photo-1591076482161-42ce6da69f67?auto=format&fit=crop&q=80&w=400" alt="Lens" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        </div>
                        <div class="p-6 flex-grow">
                            <h3 class="text-xl font-bold mb-2">Asahi Fuji Photo Grey</h3>
                            <p class="text-sm text-gray-500 mb-4">Superior Adaptive Light Control</p>
                            <a href="https://wa.me/94770000000" class="block text-center bg-[#25D366] text-white py-3 rounded-xl font-bold hover:bg-[#128C7E] transition-colors">
                                WhatsApp Inquire
                            </a>
                        </div>
                    </div>
                    <!-- Product Card 2 -->
                    <div class="brand-card bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100 flex flex-col fade-up" style="transition-delay: 100ms">
                        <div class="h-48 bg-gray-100 relative overflow-hidden group">
                            <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&q=80&w=400" alt="Lens" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        </div>
                        <div class="p-6 flex-grow">
                            <h3 class="text-xl font-bold mb-2">Asahi Fuji High-Index</h3>
                            <p class="text-sm text-gray-500 mb-4">Ultra-Thin 1.67 Optics</p>
                            <a href="https://wa.me/94770000000" class="block text-center bg-[#25D366] text-white py-3 rounded-xl font-bold hover:bg-[#128C7E] transition-colors">
                                WhatsApp Inquire
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
