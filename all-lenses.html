<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Lenses | OPTO TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white">

    <div id="navbar-placeholder"></div>

    <main class="pt-20">
        <!-- Hero -->
        <section class="py-24 bg-gray-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center fade-up">
                <h1 class="text-5xl font-bold mb-6 text-[#0b2a4a]">Full Lens Catalog</h1>
                <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                    Explore our extensive range of premium optical lenses.
                </p>
            </div>
        </section>

        <!-- Product Grid -->
        <section class="py-24">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div id="lenses-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
                    <!-- Products will be injected here via JS for efficiency in this demo, but since it's a static site request, I'll provide the HTML structure for 25 cards -->
                </div>

                <div class="mt-24 text-center p-12 bg-[#0b2a4a] text-white rounded-[3rem] fade-up">
                    <p class="text-2xl font-bold mb-4">Looking for more?</p>
                    <p class="text-gray-400 mb-8">We have only published a few products here, contact us for full catalog.</p>
                    <a href="https://wa.me/94770000000" class="inline-block bg-[#1e88e5] text-white px-8 py-4 rounded-full font-bold hover:bg-white hover:text-[#0b2a4a] transition-all">
                        Request Full Catalog
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('lenses-grid');
            const brands = ['Sunshade', 'RBS', 'Asahi Fuji', 'Clex'];
            const products = [
                'Progressive Advanced', 'Single Vision Pro', 'Bifocal Classic', 'Photo Grey Premium',
                'Blue Cut Ultra', 'Hydrophobic High-Index', 'Sports Impact Poly', 'Office Specialist',
                'Digital Relax', 'Polarized Drive', 'Anti-Fatigue', 'Drive Safe',
                'Kids Durable', 'Ultra Thin 1.67', 'Standard HMC', 'Clear Vision Plus',
                'Sunset Tinted', 'High Index 1.61', 'Double Aspheric', 'Easy Clean Pro',
                'Mirrored Fashion', 'Golf Master', 'Computer Pro', 'UV Shield', 'Basic Clear'
            ];

            products.forEach((name, i) => {
                const brand = brands[i % brands.length];
                const card = `
                    <div class="brand-card bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100 flex flex-col fade-up" style="transition-delay: ${ (i % 4) * 100 }ms">
                        <div class="h-48 bg-gray-100 relative overflow-hidden group">
                            <img src="https://images.unsplash.com/photo-1577174881658-0f30ed549adc?auto=format&fit=crop&q=80&w=400&sig=${i}" alt="Lens" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            <div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-[#0b2a4a]">${brand}</div>
                        </div>
                        <div class="p-6 flex-grow">
                            <h3 class="text-lg font-bold mb-2">${name}</h3>
                            <p class="text-xs text-gray-500 mb-4">Advanced Coating, High Clarity</p>
                            <div class="flex justify-between items-center mb-6">
                                <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">MOQ: 50 Pairs</span>
                                <span class="text-[#0b2a4a] font-bold text-sm">Contact Price</span>
                            </div>
                            <a href="https://wa.me/94770000000?text=I'm%20interested%20in%20${encodeURIComponent(name)}" class="block text-center bg-[#25D366] text-white py-2 rounded-xl text-sm font-bold hover:bg-[#128C7E] transition-colors">
                                WhatsApp Inquire
                            </a>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });

            // Re-run animations for newly added elements
            if (typeof setupAnimations === 'function') setupAnimations();
        });
    </script>
</body>
</html>
